# Phase 2: Speaker encoder pre-training
training:
  phase: 2
  name: "speaker_encoder"

  model_config: "configs/model/leander_m.yaml"

  data:
    train_manifest: "data/processed/train_manifest.jsonl"
    val_manifest: "data/processed/val_manifest.jsonl"
    samples_per_speaker: 2  # pairs for contrastive loss
    max_audio_duration: 10.0
    min_audio_duration: 3.0
    num_workers: 8

  optimizer:
    type: "adamw"
    lr: 3.0e-4
    betas: [0.9, 0.999]
    weight_decay: 0.01

  scheduler:
    type: "cosine"
    warmup_steps: 1000

  batch_size: 32
  gradient_accumulation_steps: 4
  max_steps: 30000
  max_grad_norm: 1.0
  bf16: true

  loss:
    contrastive_weight: 1.0
    contrastive_temperature: 0.07
    reconstruction_weight: 0.5

  checkpoint:
    save_every_steps: 5000
    save_dir: "checkpoints/phase2"
    keep_last_n: 3

  logging:
    wandb_project: "leander-tts"
    wandb_run_name: "phase2-speaker"
    log_every_steps: 50
    eval_every_steps: 1000
