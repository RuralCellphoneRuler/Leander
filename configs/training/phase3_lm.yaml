# Phase 3: LLM fine-tuning on text → SNAC token prediction
training:
  phase: 3
  name: "lm_finetune"

  model_config: "configs/model/leander_m.yaml"

  # Data
  data:
    train_manifest: "data/processed/train_manifest.jsonl"
    val_manifest: "data/processed/val_manifest.jsonl"
    max_audio_duration: 30.0  # seconds
    min_audio_duration: 2.0
    max_seq_len: 4096
    num_workers: 8
    pin_memory: true

  # Stage 3a: Train new components only (frozen backbone)
  stage_a:
    enabled: true
    steps: 10000
    freeze_backbone: true
    lr: 1.0e-3
    warmup_steps: 500

  # Stage 3b: Full fine-tuning
  stage_b:
    enabled: true
    steps: 100000
    freeze_backbone: false
    lr: 5.0e-5
    warmup_steps: 2000
    weight_decay: 0.01

  # Stage 3c: Expressive fine-tuning (emotion tags)
  stage_c:
    enabled: true
    steps: 10000
    freeze_backbone: false
    lr: 1.0e-5
    warmup_steps: 500
    expressive_data_only: true

  # Optimization
  optimizer:
    type: "adamw"
    betas: [0.9, 0.95]
    eps: 1.0e-8

  scheduler:
    type: "cosine"
    min_lr_ratio: 0.1

  batch_size: 4  # per GPU
  gradient_accumulation_steps: 16  # effective batch = 4 * 16 * n_gpus
  max_grad_norm: 1.0
  bf16: true

  # Loss
  loss:
    snac_ce_weight: 1.0
    speaker_consistency_weight: 0.1

  # DeepSpeed
  deepspeed:
    enabled: true
    stage: 2  # ZeRO-2
    offload_optimizer: false

  # Checkpointing
  checkpoint:
    save_every_steps: 5000
    save_dir: "checkpoints/phase3"
    keep_last_n: 3

  # Logging
  logging:
    wandb_project: "leander-tts"
    wandb_run_name: "phase3-lm-finetune"
    log_every_steps: 50
    eval_every_steps: 1000
