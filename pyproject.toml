[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leander-tts"
version = "0.1.0"
description = "Streaming German TTS with zero-shot voice cloning"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "snac",
    "tokenizers",
    "datasets",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "einops>=0.7.0",
]

[project.optional-dependencies]
train = [
    "deepspeed>=0.14.0",
    "wandb",
    "bitsandbytes",
]
eval = [
    "openai-whisper",
    "resemblyzer",
    "pesq",
]
export = [
    "onnxruntime",
    "llama-cpp-python",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["leander_tts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
